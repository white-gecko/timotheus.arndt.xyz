---
layout: default
title: "Beiträge"
weight: 10
description: ""
---

<div class="home">
  {% for post in site.posts %}
  <div class="post">
    <header class="post-header">
      <h2><a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></h2>
    </header>
    {{post.content}}
  <div class="date"><em></em>Beitrag veröffentlicht am: {{ post.date | date: "%Y-%m-%d" }}</em></div>
  </div>
  {% endfor %}
</div>
