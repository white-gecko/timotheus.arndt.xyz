---
layout: default
---
<div class="post">
  <header class="post-header">
    <h2>{{ page.title }}</h2>
    <p class="meta">{% if page.author %}{{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>

  <article class="post-content">
  {{ content }}
  <div class="date"><em></em>Beitrag veröffentlicht am: {{ page.date | date: "%Y-%m-%d" }}</em></div>
  </article>
</div>
